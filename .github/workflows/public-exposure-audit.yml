name: One-time public exposure audit

on:
  push:
    branches: [audit/public-exposure-20260909]
    paths:
      - .github/public_exposure_audit.py
      - .github/workflows/public-exposure-audit.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
  discussions: read

jobs:
  audit:
    if: github.repository == 'altive/altive-chat'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 監査スクリプトを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: 公開ファイル・履歴・GitHubメタデータを読み取り専用で検査
